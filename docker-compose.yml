services:
  # Redis 8 (includes all modules built-in: JSON, Search, Bloom, TimeSeries, and all core types)
  redis:
    image: redis:8
    container_name: redis-server
    ports:
      - "6379:6379"
    command: redis-server --requirepass devpassword --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devpassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RedisInsight for Redis management UI (optional)
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "8001:5540"
    depends_on:
      redis:
        condition: service_healthy

  # Caching Service
  caching-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caching-service
    ports:
      - "8080:8080"
    environment:
      - SERVER__HOST=0.0.0.0
      - SERVER__PORT=8080
      - REDIS__URL=redis://:devpassword@redis:6379
      - POOL__MIN_SIZE=2
      - POOL__MAX_SIZE=10
      - ADMIN__API_KEY=dev-admin-key
      - LOG__LEVEL=debug
      - LOG__FORMAT=pretty
    depends_on:
      redis:
        condition: service_healthy
    # Distroless has no shell/curl; probe from the host or use Kubernetes probes.
    # For compose, we disable the in-container check and verify externally.
    healthcheck:
      test: ["NONE"]
      disable: true

volumes:
  redis-data:
