name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy (release profile)
        run: cargo clippy --all-targets --all-features --locked --release -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Pre-pull Redis images for testcontainers
        run: |
          for image in redis:latest redis:7.4 redis/redis-stack-server:latest; do
            echo "Pulling $image"
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to pull $image after $attempt attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done

      - name: Run tests
        env:
          REDIS__URL: redis://localhost:6379
        run: |
          for attempt in 1 2; do
            if cargo test --all-features --locked --verbose; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Tests failed after retry"
              exit 1
            fi
            echo "Retrying test run after transient failure..."
            sleep 10
          done

  cluster-test:
    name: Cluster Integration
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cluster E2E (all in Docker)
        run: |
          docker compose -f docker-compose.cluster-test.yml up \
            --build --abort-on-container-exit --exit-code-from test-runner
        timeout-minutes: 15

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.cluster-test.yml down -v

  sentinel-test:
    name: Sentinel Integration
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run sentinel E2E (all in Docker)
        run: |
          docker compose -f docker-compose.sentinel-test.yml up \
            --build --abort-on-container-exit --exit-code-from test-runner
        timeout-minutes: 15

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.sentinel-test.yml down -v

  build-and-push-image:
    name: Push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
