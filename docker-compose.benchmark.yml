# Docker Compose for Performance Comparison
# Runs both Rust and Go caching services against a shared Redis instance
#
# Usage:
#   docker-compose -f docker-compose.benchmark.yml up -d --build
#
# Services:
#   - Redis Stack: localhost:6379 (RedisInsight: localhost:8001)
#   - Rust Service: localhost:8080
#   - Go Service: localhost:8081
#
# Example benchmark commands:
#   # Rust service
#   wrk -t12 -c400 -d30s http://localhost:8080/api/v1/strings/test-key
#
#   # Go service
#   wrk -t12 -c400 -d30s http://localhost:8081/api/v1/strings/test-key

services:
  # Shared Redis Stack for both services
  redis:
    image: redis/redis-stack:latest
    container_name: benchmark-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight
    environment:
      - REDIS_ARGS=--requirepass devpassword
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devpassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - benchmark-network

  # Rust Caching Service (Port 8080)
  rust-caching-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust-caching-service
    ports:
      - "8080:8080"
    environment:
      - SERVER__HOST=0.0.0.0
      - SERVER__PORT=8080
      - REDIS__URL=redis://:devpassword@redis:6379
      - POOL__MIN_SIZE=10
      - POOL__MAX_SIZE=50
      - ADMIN__API_KEY=dev-admin-key
      - LOG__LEVEL=warn
      - LOG__FORMAT=json
      - RUST_LOG=warn
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - benchmark-network

  # Go Caching Service (Port 8081)
  go-caching-service:
    build:
      context: ../caching-service
      dockerfile: Dockerfile
    container_name: go-caching-service
    ports:
      - "8081:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=devpassword
      - REDIS_MAX_CONNECTIONS=50
      - SERVER_PORT=8080
      - GIN_MODE=release
      - LOG_LEVEL=warn
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - benchmark-network

volumes:
  redis-data:
    driver: local

networks:
  benchmark-network:
    name: caching-benchmark-network
